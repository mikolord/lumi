<!doctype html>
<html lang="ru" class="account-loading"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"><meta name="theme-color" content="#161719"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="lumi"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/lumi-180.png"><title>lumi</title><link rel="stylesheet" href="style.css?v=97"></head>
<body><svg class="glass-filter-defs" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg"><filter id="glass-refraction" x="-20%" y="-30%" width="140%" height="160%"><feTurbulence type="fractalNoise" baseFrequency="0.011 0.019" numOctaves="2" seed="7" result="waves"/><feDisplacementMap in="SourceGraphic" in2="waves" scale="38" xChannelSelector="R" yChannelSelector="G"/></filter></svg><main class="app">

  <div id="filterMedia" class="hidden"><button class="filter-back" data-filter-back>‹ <span>Назад</span></button><p class="filter-caption">Типы медиафайлов</p><button class="filter-row" data-media-filter="all"><span class="filter-check">✓</span><span class="filter-icon">▦</span><span>Все объекты</span></button><button class="filter-row" data-media-filter="photos"><span class="filter-check"></span><span class="filter-icon" data-icon="photos"></span><span>Фотографии</span></button><button class="filter-row" data-media-filter="videos"><span class="filter-check"></span><span class="filter-icon" data-icon="video"></span><span>Видео</span></button></div>

</div>

<section id="collections" class="screen hidden"><div id="collectionSections">

<section class="collection-group" data-section="media"><h2><button data-collapse="media" aria-expanded="true" aria-controls="mediaContent">Типы медиафайлов<span class="section-chevron" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m7 9.5 5 5 5-5"/></svg></span></button></h2><div id="mediaContent" class="collection-group-content"><div class="utility-grid"><button class="utility" data-collection="Видео"><span data-icon="video"></span><span>Видео</span></button><button class="utility" data-collection="Избранное"><span data-icon="heart"></span><span>Избранное</span></button></div></div></section>
<section class="collection-group" data-section="other"><h2><button data-collapse="other" aria-expanded="true" aria-controls="otherContent">Другое<span class="section-chevron" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m7 9.5 5 5 5-5"/></svg></span></button></h2><div id="otherContent" class="collection-group-content"><div class="utility-grid"><button class="utility" data-collection="Скрытые"><span data-icon="eye"></span><span>Скрытые</span></button><button class="utility" data-collection="Недавно удалённые"><span data-icon="trash"></span><span>Удалены недавно</span></button></div></div></section>
</div></section>

<nav id="selectionBar" class="selection-toolbar hidden" aria-label="Действия с выбранными фотографиями"><button id="selectionShare" class="glass circle" aria-label="Поделиться выбранными"><span data-icon="share"></span></button><button id="selectionPreview" class="glass selection-preview">Показать выбранные (0)</button><button id="selectionDelete" class="glass circle" aria-label="Удалить выбранные"><span data-icon="trash"></span></button></nav><div class="viewer hidden" id="viewer"><div class="viewer-top"><button class="glass circle" id="back" aria-label="Назад"><span data-icon="back"></span></button><div class="glass viewer-date"><strong id="viewerTitle">Воскресенье</strong><small id="viewerTime">12:30</small></div><button class="glass circle" id="more" aria-label="Скрыть фотографию"><span data-icon="more"></span></button></div><div class="photo-wrap" id="photoWrap"><img id="fullPhoto" alt="Просмотр фотографии" draggable="false"><img id="nextPhoto" alt="" draggable="false" aria-hidden="true"><video id="demoVideo" class="hidden" playsinline preload="metadata" ></video><div class="video-controls glass hidden" id="videoControls"><button id="videoPlay" aria-label="Воспроизвести">▶</button><div class="video-timeline"><div class="video-times"><span id="videoCurrent">00:00.00</span><span id="videoDuration">00:05</span></div><input id="videoSeek" type="range" min="0" max="1000" value="0" step="1" aria-label="Позиция видео"></div><button id="videoMute" aria-label="Выключить звук">◖))</button></div></div><div class="viewer-bottom"><div class="filmstrip" id="filmstrip"></div><div class="toolbar"><button class="glass circle" id="share" aria-label="Поделиться"><span data-icon="share"></span></button><div class="glass viewer-tools"><button id="favorite" aria-label="В избранное"><span data-icon="heart"></span></button><button id="info" aria-label="Информация"><span data-icon="info"></span></button><button id="edit" aria-label="Правка"><span data-icon="sliders"></span></button></div><button class="glass circle" id="trash" aria-label="Удалить"><span data-icon="trash"></span></button></div></div><div class="toast hidden" id="toast"></div></div>
